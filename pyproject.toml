[project]
name = "crop-water-stress-mlops"
version = "0.1.0"
description = "Reproducible forecasting of a documented crop water stress proxy"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:.*artifact_path.*deprecated.*:FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
