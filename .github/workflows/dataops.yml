name: Optional DataOps pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-dataops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RUNTIME__DLTHUB_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: make install dataops-install
      - run: make dataops-test
      - name: Materialize offline Dagster demo through existing feature engineering
        run: make dataops-demo
      - name: Verify existing deployment assets and generate dbt lineage
        run: |
          .venv/bin/python scripts/verify_deployment_assets.py
          make dataops-dbt-docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataops-evidence
          path: |
            artifacts/dataops/ingestion.json
            artifacts/dataops/quality.json
            artifacts/dataops/dbt_target/manifest.json
            artifacts/dataops/dbt_target/run_results.json
            artifacts/dataops/dbt_target/catalog.json
